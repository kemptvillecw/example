<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Update Preferences | Kemptville Creative Writers</title>

    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/form-helpers.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="site-brand" href="../index.html">
          <img
            src="../images/logo.svg"
            alt="Kemptville Creative Writers — Where stories find their voice"
          />
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false">
          Menu
        </button>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="../index.html">Home</a>
          <a href="../about.html">About Us</a>
          <a href="../schedule.html">Schedule &amp; Events</a>
          <a href="../contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="simple-page">
      <section class="panel simple-card">
        <h1>Update Your Preferences</h1>

        <p id="pref-message">Loading your preferences…</p>

        <form id="preferences-form">
          <p id="pref-email-display" style="font-weight: bold"></p>

          <label>
            <input
              id="pref-weekly"
              type="checkbox"
              name="weekly_calendar"
              value="Yes"
            />
            Send me weekly updates about library closures and schedule changes
          </label>

          <p>
            <button class="button button-primary" type="submit">
              Save Preferences
            </button>
          </p>
        </form>

        <div id="pref-status" class="form-message"></div>
      </section>
    </main>

    <script src="../scripts/preferences.js"></script>
  </body>
</html>
